services:
  local-streamer:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: local-streamer
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      STORAGE_DIR: /app/storage
    volumes:
      - ${LOCAL_STREAMER_STORAGE_MOUNT:-local-streamer-storage}:/app/storage
    networks:
      - local-streamer-network
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

networks:
  local-streamer-network:
    driver: bridge

volumes:
  local-streamer-storage:
