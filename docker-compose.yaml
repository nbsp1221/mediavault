services:
  mediavault:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    init: true
    restart: unless-stopped
    stop_grace_period: 35s
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: '3000'
      MEDIAVAULT_STORAGE_DIR: /app/storage
    ports:
      - '3000:3000'
    volumes:
      - mediavault-storage:/app/storage
    networks:
      - mediavault-network
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  mediavault-network:
    driver: bridge

volumes:
  mediavault-storage:
